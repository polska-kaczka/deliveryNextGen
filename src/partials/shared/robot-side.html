<svg class="robot-svg" viewBox="0 0 520 330" aria-hidden="true" focusable="false">
  <!-- Side view, facing right. Materials live in dng-defs.html; robot-mini.html is the same model at LOD. -->

  <!-- contact shadow -->
  <g class="rb-shadow">
    <ellipse cx="262" cy="308" rx="226" ry="14" fill="url(#dngShadow)"/>
    <ellipse cx="262" cy="306" rx="170" ry="5" fill="url(#dngAO)" opacity=".55"/>
  </g>

  <g class="robot-drive">
    <!-- headlight pool on the ground (dark bands only) -->
    <path class="rb-head" d="M450 220 L640 262 L640 312 L448 232 Z" fill="url(#dngHeadBeam)"/>
    <ellipse class="rb-head" cx="560" cy="306" rx="90" ry="8" fill="#9befff" fill-opacity=".12"/>

    <!-- running gear: rocker-bogie + three wheels -->
    <g class="rb-wheels">
      <path d="M146 272 L204 258 H320 L378 272" fill="none" stroke="#24282d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M150 267 L204 254 H320" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2" stroke-linecap="round"/>
      <circle cx="204" cy="258" r="6.5" fill="#33383f"/><circle cx="204" cy="258" r="2.4" fill="#8d96a1"/>
      <circle cx="262" cy="258" r="9" fill="#33383f"/><circle cx="262" cy="258" r="3.5" fill="#8d96a1"/>
      <g class="wheel">
        <circle cx="146" cy="272" r="34" fill="url(#dngTyre)"/>
        <circle cx="146" cy="272" r="31" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3.2 4.2"/>
        <path d="M120 256 A 30 30 0 0 1 162 245" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="146" cy="272" r="22.5" fill="url(#dngRim)"/>
        <g stroke="#7d8691" stroke-width="4.2" stroke-linecap="round"><line x1="146" y1="264" x2="146" y2="252.5"/><line x1="153.6" y1="269.5" x2="164.5" y2="266"/><line x1="150.7" y1="278.5" x2="157.4" y2="287.8"/><line x1="141.3" y1="278.5" x2="134.6" y2="287.8"/><line x1="138.4" y1="269.5" x2="127.5" y2="266"/></g>
        <circle cx="146" cy="272" r="22.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
        <circle cx="146" cy="272" r="7.5" fill="#2b2f35"/>
        <g fill="#6b737d"><circle cx="146" cy="267.2" r="1.1"/><circle cx="150.6" cy="270.5" r="1.1"/><circle cx="148.8" cy="275.9" r="1.1"/><circle cx="143.2" cy="275.9" r="1.1"/><circle cx="141.4" cy="270.5" r="1.1"/></g>
        <circle cx="146" cy="272" r="2.4" fill="#00d4f0"/>
      </g>
      <g class="wheel">
        <circle cx="262" cy="272" r="34" fill="url(#dngTyre)"/>
        <circle cx="262" cy="272" r="31" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3.2 4.2"/>
        <path d="M236 256 A 30 30 0 0 1 278 245" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="262" cy="272" r="22.5" fill="url(#dngRim)"/>
        <g stroke="#7d8691" stroke-width="4.2" stroke-linecap="round"><line x1="262" y1="264" x2="262" y2="252.5"/><line x1="269.6" y1="269.5" x2="280.5" y2="266"/><line x1="266.7" y1="278.5" x2="273.4" y2="287.8"/><line x1="257.3" y1="278.5" x2="250.6" y2="287.8"/><line x1="254.4" y1="269.5" x2="243.5" y2="266"/></g>
        <circle cx="262" cy="272" r="22.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
        <circle cx="262" cy="272" r="7.5" fill="#2b2f35"/>
        <g fill="#6b737d"><circle cx="262" cy="267.2" r="1.1"/><circle cx="266.6" cy="270.5" r="1.1"/><circle cx="264.8" cy="275.9" r="1.1"/><circle cx="259.2" cy="275.9" r="1.1"/><circle cx="257.4" cy="270.5" r="1.1"/></g>
        <circle cx="262" cy="272" r="2.4" fill="#00d4f0"/>
      </g>
      <g class="wheel">
        <circle cx="378" cy="272" r="34" fill="url(#dngTyre)"/>
        <circle cx="378" cy="272" r="31" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3.2 4.2"/>
        <path d="M352 256 A 30 30 0 0 1 394 245" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="378" cy="272" r="22.5" fill="url(#dngRim)"/>
        <g stroke="#7d8691" stroke-width="4.2" stroke-linecap="round"><line x1="378" y1="264" x2="378" y2="252.5"/><line x1="385.6" y1="269.5" x2="396.5" y2="266"/><line x1="382.7" y1="278.5" x2="389.4" y2="287.8"/><line x1="373.3" y1="278.5" x2="366.6" y2="287.8"/><line x1="370.4" y1="269.5" x2="359.5" y2="266"/></g>
        <circle cx="378" cy="272" r="22.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
        <circle cx="378" cy="272" r="7.5" fill="#2b2f35"/>
        <g fill="#6b737d"><circle cx="378" cy="267.2" r="1.1"/><circle cx="382.6" cy="270.5" r="1.1"/><circle cx="380.8" cy="275.9" r="1.1"/><circle cx="375.2" cy="275.9" r="1.1"/><circle cx="373.4" cy="270.5" r="1.1"/></g>
        <circle cx="378" cy="272" r="2.4" fill="#00d4f0"/>
      </g>
    </g>

    <!-- sprung body -->
    <g class="rb-body">
      <!-- antenna + pennant (the rig swings it on its base like a whip) -->
      <g class="rb-antenna">
        <line x1="118" y1="104" x2="118" y2="10" stroke="#c6ccd3" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="117.2" y1="104" x2="117.2" y2="12" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/>
        <circle class="rb-tip" cx="118" cy="9" r="3.2" fill="#00d4f0"/>
        <path class="rb-flag" fill="#00a9c7" d="M120 14 C138 16 152 22 170 28 C152 32 138 38 120 42 Z">
          <animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"
            values="M120 14 C138 16 152 22 170 28 C152 32 138 38 120 42 Z;M120 14 C140 23 154 16 173 26 C154 35 140 43 120 42 Z;M120 14 C138 11 153 27 168 30 C152 28 138 45 120 42 Z;M120 14 C138 16 152 22 170 28 C152 32 138 38 120 42 Z"/>
        </path>
        <path d="M120 16 C134 18 146 22 160 27" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <ellipse cx="118" cy="101" rx="7" ry="2.6" fill="#b8bec6"/>

      <!-- graphite chassis -->
      <path d="M74 196 H452 V226 C452 242 440 252 424 252 H102 C86 252 74 242 74 226 Z" fill="url(#dngChassis)"/>
      <path d="M86 200 H440" stroke="#fff" stroke-opacity=".12" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="104" y="232" width="316" height="3" rx="1.5" fill="#000" fill-opacity=".35"/>
      <!-- side reflectors, bumper sonar, headlight -->
      <rect x="92" y="217" width="14" height="3.4" rx="1.7" fill="#ff5a4e" fill-opacity=".85"/>
      <rect x="392" y="217" width="14" height="3.4" rx="1.7" fill="#ffb020" fill-opacity=".9"/>
      <g fill="#0d0f12" stroke="#5a616b" stroke-width=".7"><circle cx="420" cy="241" r="2.2"/><circle cx="430" cy="241" r="2.2"/><circle cx="440" cy="239.5" r="2.2"/></g>
      <rect class="rb-headlamp" x="440" y="214" width="11" height="7" rx="3.5" fill="#eafcff" filter="url(#dngGlow)"/>

      <!-- pearl shell -->
      <path d="M98 212 C 84 212 72 202 72 188 V 150 C 72 118 98 96 132 96 H 384 C 424 96 454 126 458 160 L 460 194 C 461 205 452 212 442 212 Z" fill="url(#dngShell)"/>
      <path d="M98 212 C 84 212 72 202 72 188 V 150 C 72 118 98 96 132 96 H 384 C 424 96 454 126 458 160 L 460 194 C 461 205 452 212 442 212 Z" fill="url(#dngShellSide)"/>
      <path d="M98 212 C 84 212 72 202 72 188 V 150 C 72 118 98 96 132 96 H 384 C 424 96 454 126 458 160 L 460 194 C 461 205 452 212 442 212 Z" fill="none" stroke="#000" stroke-opacity=".08"/>
      <!-- lid seam + bevel -->
      <path d="M80 141 H394" stroke="#000" stroke-opacity=".09" stroke-width="1.6"/>
      <path d="M80 143.5 H394" stroke="#fff" stroke-opacity=".9" stroke-width="1.2"/>

      <!-- insulated cargo bay (seen only when the lid opens) -->
      <path d="M80 141 C 80 121 102 103 134 103 H 390 V 141 Z" fill="url(#dngBay)"/>
      <path d="M88 141 C 88 126 106 111 136 111 H 383 V 141 Z" fill="#2c3137"/>
      <path d="M92 138 H 380" stroke="#00d4f0" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round"/>

      <!-- cargo lid, hinged at the rear -->
      <g class="rb-lid">
        <path d="M72.8 141 C 72.8 116 98 96 132 96 H 384 C 388 96 391.5 96.3 394.5 96.9 V 141 Z" fill="url(#dngShell)"/>
        <path d="M72.8 141 C 72.8 116 98 96 132 96 H 384 C 388 96 391.5 96.3 394.5 96.9 V 141 Z" fill="url(#dngShellSide)"/>
        <path d="M394.5 97 V 141" stroke="#000" stroke-opacity=".1" stroke-width="1.2"/>
        <path d="M118 104 C 160 100 300 100 386 103" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" filter="url(#dngSoft)"/>
        <rect x="214" y="114" width="80" height="8" rx="4" fill="#000" fill-opacity=".06"/>
        <rect x="214" y="121" width="80" height="1.4" rx=".7" fill="#fff"/>
      </g>

      <!-- nose lidar puck -->
      <g class="rb-puck">
        <rect x="400" y="88" width="26" height="9" rx="3" fill="url(#dngPuck)"/>
        <g clip-path="url(#dngPuckClip)"><rect class="rb-puck-sweep" x="396" y="86" width="5" height="13" fill="#5ce6f7" fill-opacity=".7"/></g>
        <rect x="402" y="96" width="22" height="3" rx="1.5" fill="#c6ccd3"/>
      </g>

      <!-- rear panel line, tail light + brake glow -->
      <path d="M362 146 V200" stroke="#000" stroke-opacity=".06" stroke-width="1.4"/>
      <rect x="74" y="164" width="5" height="22" rx="2.5" fill="#ff5a4e"/>
      <rect x="74" y="164" width="5" height="22" rx="2.5" fill="#ff5a4e" filter="url(#dngGlow)" opacity=".7"/>
      <g class="rb-brake" opacity="0">
        <ellipse cx="72" cy="175" rx="16" ry="20" fill="#ff3b30" fill-opacity=".22" filter="url(#dngSoft)"/>
        <rect x="73" y="163" width="6.5" height="24" rx="3.2" fill="#ff7a70" filter="url(#dngGlow)"/>
      </g>
      <!-- side camera -->
      <circle cx="104" cy="166" r="8" fill="#e6e9ed"/>
      <circle cx="104" cy="166" r="5.5" fill="#15181c"/>
      <circle cx="102.4" cy="164.4" r="1.6" fill="#8fa3b6"/>
      <!-- charge port cover -->
      <rect x="318" y="180" width="22" height="10" rx="5" fill="#000" fill-opacity=".05"/>
      <rect x="318" y="189" width="22" height="1.2" rx=".6" fill="#fff"/>
      <circle class="rb-port" cx="335" cy="185" r="1.6" fill="#34c759"/>
      <!-- embossed brand -->
      <g transform="translate(132 160)">
        <rect x="0" y="1" width="15" height="15" rx="4.5" fill="#fff"/>
        <rect x="0" y="0" width="15" height="15" rx="4.5" fill="#b8bec6"/>
        <rect x="3.6" y="5.6" width="2.8" height="4" rx="1.4" fill="#f3f4f6"/><rect x="8.6" y="5.6" width="2.8" height="4" rx="1.4" fill="#f3f4f6"/>
        <text x="22" y="13" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="-0.3" fill="#fff">DeliveryNextGen</text>
        <text x="22" y="12" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="-0.3" fill="#b8bec6">DeliveryNextGen</text>
      </g>

      <!-- wrap-around light strip -->
      <rect class="status" x="98" y="202.2" width="340" height="3.6" rx="1.8" fill="#00d4f0" filter="url(#dngGlow)"/>
      <g clip-path="url(#dngStatusClip)"><rect class="rb-scan" x="38" y="200" width="60" height="9" fill="url(#dngSheen)"/></g>

      <!-- lidar beam -->
      <g class="rb-beam">
        <path d="M456 160 L566 126 L566 236 L458 192 Z" fill="url(#dngBeam)"/>
        <path class="rb-arc" d="M468 160 Q476 176 468 192" fill="none" stroke="#5ce6f7" stroke-width="2" stroke-linecap="round"/>
        <path class="rb-arc" d="M468 160 Q476 176 468 192" fill="none" stroke="#5ce6f7" stroke-width="2" stroke-linecap="round"/>
        <path class="rb-arc" d="M468 160 Q476 176 468 192" fill="none" stroke="#5ce6f7" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- smoked visor -->
      <path d="M396 114 C 428 116, 452 136, 457 160 L 459 186 C 446 195, 420 199, 396 197 C 389 170, 389 140, 396 114 Z" fill="url(#dngVisor)"/>
      <g clip-path="url(#dngGlassClip)">
        <path d="M392 128 C 420 124 446 136 458 150" fill="none" stroke="url(#dngVisorRefl)" stroke-width="7" stroke-linecap="round"/>
        <rect class="rb-glint" x="360" y="100" width="12" height="120" fill="#fff" fill-opacity=".14" transform="rotate(18 366 160)"/>
        <circle cx="446" cy="182" r="3.2" fill="#1f252c"/><circle cx="445.2" cy="181.2" r="1" fill="#8fa3b6"/>
      </g>
      <path d="M396 114 C 428 116, 452 136, 457 160" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
      <g class="rb-eyes">
        <g filter="url(#dngGlow)" opacity=".85">
          <rect class="eye" x="414" y="146" width="10" height="22" rx="5" fill="#00d4f0"/>
          <rect class="eye" x="432" y="148" width="10" height="21" rx="5" fill="#00d4f0"/>
        </g>
        <rect class="eye" x="416" y="149" width="6" height="16" rx="3" fill="#d6fbff"/>
        <rect class="eye" x="434" y="151" width="6" height="15" rx="3" fill="#d6fbff"/>
      </g>
    </g>
  </g>
</svg>
